[workspace]
members = [
  "crates/theme",
  "crates/motion",
  "crates/syntax",
  "crates/ui",
  "crates/component-zoo",
  "crates/gallery",
  "crates/a2ui-demo",
  "crates/makepad-plot",
  "crates/raycast-launcher",
  "crates/makepad-clipboard",
  "crates/gemini-talker",
  "crates/canvas-terminal",
  "crates/dbpro",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]

# Local makepad checkout (dev branch). The PdfView fixes (visible page paper
# shader, `cm` pre-multiply, text decoding) that canvas-terminal's dropped-PDF
# preview needs landed in 14fe611e; older pins render blank PDF pages.
# NOTE: this tracks whatever is checked out in the makepad clone, not a pin.
makepad-widgets = { path = "/Users/sternelee/www/github/makepad/widgets" }
makepad-script = { path = "/Users/sternelee/www/github/makepad/platform/script" }
makepad-component = { path = "crates/ui" }
makepad-theme = { path = "crates/theme" }
makepad-motion = { path = "crates/motion" }
makepad-syntax = { path = "crates/syntax" }
makepad-plot = { path = "crates/makepad-plot" }

# Optimize audio decoder even in debug builds (symphonia does heavy float math)
[profile.dev.package.symphonia-core]
opt-level = 2
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 2
[profile.dev.package.symphonia-codec-aac]
opt-level = 2
[profile.dev.package.symphonia-format-isomp4]
opt-level = 2
