[workspace]
members = [
  "crates/theme",
  "crates/motion",
  "crates/ui",
  "crates/component-zoo",
  "crates/a2ui-demo",
  "crates/makepad-plot",
  "crates/raycast-launcher",
  "crates/makepad-clipboard",
  "crates/gemini-talker",
  "crates/canvas-terminal",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]

# Pinned to 2026-09 makepad dev HEAD: contains the PdfView fixes (visible
# page paper shader, `cm` pre-multiply, text decoding) required by
# canvas-terminal's dropped-PDF preview. Older pins render blank PDF pages.
makepad-widgets = { git = "https://github.com/makepad/makepad", rev = "14fe611e66c7defda5cef84cc1bbcae2eee29b2f" }
makepad-script = { git = "https://github.com/makepad/makepad", rev = "14fe611e66c7defda5cef84cc1bbcae2eee29b2f" }
makepad-component = { path = "crates/ui" }
makepad-theme = { path = "crates/theme" }
makepad-motion = { path = "crates/motion" }
makepad-plot = { path = "crates/makepad-plot" }

# Optimize audio decoder even in debug builds (symphonia does heavy float math)
[profile.dev.package.symphonia-core]
opt-level = 2
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 2
[profile.dev.package.symphonia-codec-aac]
opt-level = 2
[profile.dev.package.symphonia-format-isomp4]
opt-level = 2
