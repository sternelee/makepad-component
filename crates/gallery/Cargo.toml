[package]
name = "gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The documentation: a rail of every component, live"

[dependencies]
makepad-component = { workspace = true }
makepad-theme = { workspace = true }
makepad-motion = { workspace = true }
makepad-syntax = { path = "../syntax" }
makepad-markdown = { path = "../markdown" }
makepad-editor = { path = "../editor" }
makepad-canvas = { path = "../canvas" }
makepad-blocks = { path = "../blocks" }
makepad-plot = { path = "../makepad-plot" }
makepad-widgets = { workspace = true }
# For the local timezone offset only (the non-web branch; see `local_utc_offset_seconds`). The
# date arithmetic lives in `makepad_component::mp::date` and is tested; what a library cannot
# know is **which zone the reader is in**, and that is the one thing this asks the OS for.
libc = "0.2"

# **The page is named in the URL on the web, and the two browser facts — `?page=` and the
# timezone — reach the app through makepad's own wasm ABI, not wasm-bindgen.** `GALLERY_PAGE` is
# how every other consumer drives this app, and a browser has no environment to set; the browser
# names the page the way a browser can: `?page=Loaders`.
#
# `web-sys`/`js-sys` would compile to `__wbindgen_placeholder__` imports that only wasm-bindgen's
# generated glue can satisfy — and makepad's bridge instantiates the module with its own `{ env }`
# import object, so the glue never runs and every page dies at
# `Import #13 "__wbindgen_placeholder__": module is not an object or function`. The bridge (in the
# makepad clone's `libs/wasm_bridge/src/wasm_bridge.js`) instead provides `js_query_param` and
# `js_local_timezone_offset` as plain `env` imports, which `app.rs` declares with
# `#[link(wasm_import_module = "env")]`. Nothing in the tree may pull wasm-bindgen into a
# `wasm32-unknown-unknown` build.

