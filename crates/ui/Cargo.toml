[package]
name = "makepad-component"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI components for Makepad applications"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
makepad-widgets = { workspace = true }
makepad-plot = { workspace = true, optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

# A2A/SSE streaming support
ureq = { version = "2.9", features = ["json"] }
uuid = { version = "1.0", features = ["v4"] }

[features]
default = []
# makepad-plot is still on the legacy live_design API and does not compile
# against makepad 2.0. Do not enable until makepad-plot is migrated.
plot = ["dep:makepad-plot"]
