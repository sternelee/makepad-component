[package]
name = "canvas-terminal"
version.workspace = true
edition.workspace = true
description = "Infinite Canvas Terminal Workspace - AI terminal canvas (CNVS-style) on Makepad"

[[bin]]
name = "canvas-terminal"
path = "src/main.rs"

[dependencies]
# `cef` = embedded browser cards; `pdf` = native PdfView (makepad's own PDF
# renderer) backing dropped-PDF preview cards.
makepad-widgets = { workspace = true, features = ["cef", "pdf"] }
makepad-script = { workspace = true }
makepad-cef = { path = "/Users/sternelee/www/github/makepad/libs/cef" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# PTY + local IPC layer (cross-platform: Unix PTY / Windows ConPTY,
# Unix domain sockets / Windows named pipes). These replace the previous
# rmux-sdk dependency so the app no longer requires a system-installed rmux
# daemon — `canvas-terminal` re-executes itself in `--daemon` mode to hold
# the PTYs, surviving GUI restarts for session re-attach.
# Headless agent runtime (provider drivers + tool loop + event journal).

rmux-pty = "0.10.0"
rmux-ipc = "0.10.0"
libc = "0.2"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "time",
  "sync",
  "io-util",
  "net",
] }
vte = "0.14"
