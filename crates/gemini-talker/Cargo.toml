[package]
name = "gemini-talker"
version = "0.1.0"
edition = "2021"
description = "Gemini AI Chat Application for Makepad - Garden UI"

[[bin]]
name = "gemini-talker"
path = "src/main.rs"

[dependencies]
makepad-widgets = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"

# Gemini Live API integration
tokio = { version = "1", features = ["full"] }
gemini-live = "0.1.8"
base64 = "0.22"

# Native file dialog
rfd = "0.15"

# Data directory
dirs = "5"

# Async runtime
once_cell = "1.19"

# SQLite persistence
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
image = "0.25"
cpal = "0.15"
hound = "3.5"
