[package]
name = "raycast-launcher"
version.workspace = true
edition.workspace = true
description = "Raycast-style app search launcher rendered with live_design"

[[bin]]
name = "raycast-launcher"
path = "src/main.rs"

[dependencies]
makepad-widgets = { workspace = true }
makepad-component = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ADK Rust for LLM agent integration
adk-core = "0.3"
adk-agent = "0.3"
adk-model = { version = "0.3", features = [
  "openai",
  "anthropic",
  "gemini",
  "deepseek",
] }
adk-tool = "0.3"
adk-runner = "0.3"
adk-ui = "0.3"
adk-session = "0.3"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "rt",
] }
anyhow = "1.0"
schemars = "0.8"
reqwest = { version = "0.12", features = ["json"] }
futures = "0.3"
