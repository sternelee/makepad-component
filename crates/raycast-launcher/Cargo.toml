[package]
name = "raycast-launcher"
version.workspace = true
edition.workspace = true
description = "Raycast-style app search launcher rendered with script_mod"

[[bin]]
name = "raycast-launcher"
path = "src/main.rs"

[dependencies]
makepad-widgets = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
